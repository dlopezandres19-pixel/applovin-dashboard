name: Backfill history (run once)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First week to download (YYYY-MM-DD)"
        default: "2025-01-04"
        required: true
      dry_run:
        description: "Only count credits, do not call the API"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: builtwith-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          BUILTWITH_API_KEY: ${{ secrets.BUILTWITH_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tracker.py backfill --start "${{ inputs.start }}" --dry-run
          else
            python tracker.py backfill --start "${{ inputs.start }}"
          fi
      - name: Commit results
        if: ${{ always() && inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Backfill BuiltWith history from ${{ inputs.start }}"
          git push
