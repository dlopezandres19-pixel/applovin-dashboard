name: Rebuild dashboard (no API calls)

on:
  push:
    branches: [main]
    paths:
      - "data/APP_Dashboard.xlsx"
      - "dashboard_template.html"
      - "tracker.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builtwith-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tracker.py build
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Rebuild dashboard $(date -u +%F)"
          git push
