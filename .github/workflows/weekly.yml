name: Weekly BuiltWith update

on:
  schedule:
    - cron: "17 15 * * 6"   # every Saturday 15:17 UTC (10:17 Lima)
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: builtwith-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull BuiltWith and rebuild dashboard
        env:
          BUILTWITH_API_KEY: ${{ secrets.BUILTWITH_API_KEY }}
        run: python tracker.py weekly --recheck 4
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Weekly BuiltWith update $(date -u +%F)"
          git push
